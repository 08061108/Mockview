log_format without_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
# Nginx error logs cannot format/redact request URIs. Keep credentials out even
# when a legacy client sends a token query; use sanitized API logs for diagnosis.
error_log /dev/null;

server {
    listen 80;
    server_name _;

    # Override the base image's http-level main log instead of adding a second log.
    access_log /var/log/nginx/access.log without_query;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_origin http://api:8000;

    location = /health {
        proxy_pass $api_origin/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
