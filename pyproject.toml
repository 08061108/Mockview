[project]
name = "mockview"
version = "0.1.0"
description = "JD and resume driven AI interview practice platform"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.lock"]}

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.4.0"]
eval = ["ragas>=0.2.0", "datasets>=2.18.0", "matplotlib==3.11.2"]
legacy = ["gradio==6.14.0", "matplotlib==3.11.2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
